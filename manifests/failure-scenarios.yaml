# Two pods that are meant to fail, for practising `kubectl describe` / `kubectl logs`.
# On 19 Sep 2026 they were started with:
#   kubectl run broken-img --image=nginx:nonexistent999
#   kubectl run crashing-app --image=busybox -- /bin/sh -c "exit 1"
# Here busybox is pinned instead of :latest.
---
# ImagePullBackOff: the tag does not exist, so the registry answers "not found".
apiVersion: v1
kind: Pod
metadata:
  name: broken-img
  labels:
    run: broken-img
spec:
  containers:
    - name: broken-img
      image: nginx:nonexistent999
---
# CrashLoopBackOff: the image pulls fine, the process exits 1, and the kubelet keeps restarting it.
apiVersion: v1
kind: Pod
metadata:
  name: crashing-app
  labels:
    run: crashing-app
spec:
  containers:
    - name: crashing-app
      image: busybox:1.37
      args: ["/bin/sh", "-c", "exit 1"]
