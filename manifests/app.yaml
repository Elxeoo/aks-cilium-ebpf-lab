# A declarative equivalent of the objects from the 19 Sep 2026 run, written afterwards and
# not applied yet. That day the `web-app` Deployment was created imperatively, scaled to 3
# and exposed with:
#   kubectl expose deployment web-app --port=80 --target-port=80 --name=web-service
# Here the image is pinned to nginx 1.31.6, the version that answered the curl test
# (Server: nginx/1.31.6), and containerPort is declared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.6
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: web-app
spec:
  type: ClusterIP
  selector:
    app: web-app
  ports:
    - port: 80
      targetPort: 80
