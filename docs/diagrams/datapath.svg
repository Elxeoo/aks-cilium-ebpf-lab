<svg xmlns="http://www.w3.org/2000/svg" width="960" height="474" viewBox="0 0 960 474" role="img" aria-label="Side by side: with kube-proxy a connection to the ClusterIP walks iptables NAT chains and is rewritten per packet by conntrack; with Cilium socket-LB an eBPF program on connect() looks the service up once in a hash map and connects the socket straight to a pod.">
<title>Side by side: with kube-proxy a connection to the ClusterIP walks iptables NAT chains and is rewritten per packet by conntrack; with Cilium socket-LB an eBPF program on connect() looks the service up once in a hash map and connects the socket straight to a pod.</title>
