<text x="37.8" y="51.8" fill="#d9734e" textLength="210.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">0: kube-proxy · iptables mode</text>
<text x="335.0" y="51.8" fill="#8b949e" textLength="116.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the classic path</text>
<text x="509.0" y="51.8" fill="#ffd77a" textLength="246.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">1: cilium socket-lb · this cluster</text>
<text x="791.8" y="51.8" fill="#8b949e" textLength="130.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">azure cni + cilium</text>
<text x="37.8" y="83.8" fill="#d9734e" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[1]</text>
<text x="74.0" y="83.8" fill="#e6edf3" textLength="166.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">connect(10.0.63.110:80)</text>
<text x="509.0" y="83.8" fill="#e3b341" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[1]</text>
<text x="545.2" y="83.8" fill="#e6edf3" textLength="166.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">connect(10.0.63.110:80)</text>
<text x="74.0" y="99.8" fill="#8b949e" textLength="275.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">socket opened to the virtual clusterip</text>
<text x="545.2" y="99.8" fill="#8b949e" textLength="311.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">ebpf program attached to the connect() hook</text>
<text x="37.8" y="147.8" fill="#d9734e" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[2]</text>
<text x="74.0" y="147.8" fill="#e6edf3" textLength="174.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">nat table: KUBE-SERVICES</text>
<text x="509.0" y="147.8" fill="#e3b341" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[2]</text>
<text x="545.2" y="147.8" fill="#e6edf3" textLength="217.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">lookup in the service hash map</text>
<text x="74.0" y="163.8" fill="#8b949e" textLength="319.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">rules matched in order, one per service port</text>
<text x="552.5" y="195.8" fill="#6e7681" textLength="159.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">SERVICE ADDRESS (slot)</text>
<text x="748.2" y="195.8" fill="#6e7681" textLength="50.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">BACKEND</text>
<text x="37.8" y="211.8" fill="#d9734e" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[3]</text>
<text x="74.0" y="211.8" fill="#e6edf3" textLength="72.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">KUBE-SVC-…</text>
<text x="552.5" y="211.8" fill="#8b949e" textLength="159.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.0.63.110:80/TCP (0)</text>
<text x="748.2" y="211.8" fill="#6e7681" textLength="152.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">0.0.0.0:0 [ClusterIP]</text>
<text x="74.0" y="227.8" fill="#8b949e" textLength="253.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">random pick between endpoint chains</text>
<text x="552.5" y="227.8" fill="#8b949e" textLength="159.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.0.63.110:80/TCP (1)</text>
<text x="748.2" y="227.8" fill="#e6edf3" textLength="101.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.244.0.10:80</text>
<text x="552.5" y="243.8" fill="#8b949e" textLength="159.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.0.63.110:80/TCP (2)</text>
<text x="748.2" y="243.8" fill="#ffd77a" textLength="101.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">10.244.0.83:80</text>
<text x="552.5" y="259.8" fill="#8b949e" textLength="159.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.0.63.110:80/TCP (3)</text>
<text x="748.2" y="259.8" fill="#e6edf3" textLength="108.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">10.244.0.115:80</text>
<text x="37.8" y="275.8" fill="#d9734e" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[4]</text>
<text x="74.0" y="275.8" fill="#e6edf3" textLength="72.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">KUBE-SEP-…</text>
<text x="161.0" y="275.8" fill="#e6edf3" textLength="94.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">DNAT → pod ip</text>
<text x="74.0" y="291.8" fill="#8b949e" textLength="333.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">first packet only; conntrack rewrites the rest</text>
<text x="661.2" y="291.8" fill="#6e7681" textLength="268.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cilium-dbg bpf lb list · recorded run</text>
<text x="37.8" y="339.8" fill="#d9734e" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[5]</text>
<text x="74.0" y="339.8" fill="#e6edf3" textLength="130.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">pod 10.244.0.83:80</text>
<text x="509.0" y="339.8" fill="#e3b341" textLength="21.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[3]</text>
<text x="545.2" y="339.8" fill="#e6edf3" textLength="246.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">socket connected to 10.244.0.83:80</text>
<text x="545.2" y="355.8" fill="#8b949e" textLength="377.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the clusterip never hits the wire, no per-packet nat</text>
<text x="37.8" y="403.8" fill="#d9734e" textLength="268.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">cost grows with every service you add</text>
<text x="509.0" y="403.8" fill="#e3b341" textLength="217.5" lengthAdjust="spacingAndGlyphs" xml:space="preserve">one hash lookup per connection</text>
<text x="23.2" y="467.8" fill="#0d1117" textLength="145.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">[aks-lab] 0:iptables</text>
<text x="182.8" y="467.8" fill="#0d1117" textLength="65.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve" font-weight="700">1:cilium*</text>
<text x="704.8" y="467.8" fill="#0d1117" textLength="232.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">node aks-systempool · k8s 1.35.8</text>

